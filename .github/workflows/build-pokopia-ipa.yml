# Plantilla para GitHub Actions — Pokopia IPA (solo el build, sin archivos del juego)
# Este archivo esta en el repo PUBLICO de WebOS por decision de Wilfry (2026-11-02),
# aunque lo ideal es copiarlo a su repo PRIVADO pokopia. NO contiene ningun link,
# ningun dump, ningun certificado y ningun Team ID.
# NO pases tu link de Drive a Cronx. El link va COMO SECRETO en TU repo, nunca en este archivo.
#
# Requisitos que vienen del README de xFractals/pokopia-native:
# - Runner macOS con Xcode 27, Python 3.12, .NET 10 y xcodegen
# - El build de iPhone solo (--ipa), no la app de Mac
# - Firma para iPhone con equipo PAGADO de Apple Developer con entitlements
#   (Increased Memory Limit + Extended Virtual Addressing).
#   Sin ese equipo, el IPA con ID gratis instala y se detiene al arrancar.
# - Borra el artefacto de GitHub en cuanto lo descargues. retention-days: 1 ayuda, no sustituye borrarlo tu.
#
# PASOS QUE TU HACES (Cronx NO los corre, NO recibe tu dump y NO firma nada):
# 1. Sube tu dump COMPRIMIDO en un solo .zip a TU Drive, con Anyone with link (Viewer).
#    El runner no tiene tu sesion de Google, con Restricted no puede bajarlo.
#    El link solo va como secreto, nunca publicado, y borra el archivo al terminar.
#    El .zip, al descomprimirlo, debe dejar updates/327680/exefs/ y romfs/,
#    o exefs/ y romfs/ directamente en la carpeta.
# 2. En TU repo, pon el link de descarga directa de ese .zip como secreto
#    (nombre: DRIVE_DOWNLOAD_URL). Nunca lo escribas en este archivo ni en el chat.
# 3. Pon tu Team ID como secreto en TU repo (nombre: APPLE_TEAM_ID) si vas a firmar con Xcode.
# 4. Lanza el workflow a mano (workflow_dispatch), descarga el IPA, y borralo de GitHub de una vez.
# 5. El refresh de shaders despues de jugar zonas nuevas va aparte, en tu maquina / telefono.

name: Build Pokopia IPA

on:
  workflow_dispatch:
    inputs:
      dump_path:
        description: "Ruta del dump YA presente en el runner, si NO usas el secreto DRIVE_DOWNLOAD_URL"
        required: false
        default: "dump"
        type: string
      sign_with_xcode:
        description: "Firmar con Xcode y tu equipo pagado (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build-ipa:
    # Run 5 (41566750418) fallo al final del empaquetado IPA con Xcode 26.6
    # (DmGamepad.m: property 'deviceMotionBody' not found): nxnative/pokopia-native
    # pide Xcode 27 / SDK 27, y la imagen macos-26 solo trae Xcode 26.x.
    # xcode-27 es la imagen de GitHub con Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Checkout pokopia-native (solo herramientas, sin contenido del juego)
        uses: actions/checkout@v4
        with:
          repository: xFractals/pokopia-native
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools (XcodeGen, .NET, Python deps del README)
        run: |
          brew install xcodegen
          brew install --cask dotnet-sdk
          python3.12 -m pip install "capstone>=5,<6" lz4 fonttools
          xcodebuild -version
          # Fallo rapido si el runner no trae Xcode 27: no vale la pena
          # compilar shaders 90 minutos para fallar al empaquetar el IPA.
          XCODE_MAJOR=$(xcodebuild -version | head -n 1 | sed -E 's/.* ([0-9]+)\..*/\1/')
          if [ "$XCODE_MAJOR" -lt 27 ]; then
            echo "ERROR: se necesita Xcode 27+, este runner trae Xcode $XCODE_MAJOR."
            exit 1
          fi
          python3.12 --version

      - name: Check tools (doctor)
        run: python3.12 nxs2.py doctor || true

      - name: Descargar y descomprimir dump desde secreto (si esta puesto)
        id: resolve
        env:
          DRIVE_DOWNLOAD_URL: ${{ secrets.DRIVE_DOWNLOAD_URL }}
        run: |
          if [ -z "$DRIVE_DOWNLOAD_URL" ]; then
            echo "Sin secreto DRIVE_DOWNLOAD_URL: se usara dump_path del input."
            echo "dump_path=${{ inputs.dump_path }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Descargando dump desde el secreto (el link NO se imprime en el log)..."
          python3.12 -m pip install -q gdown
          # gdown maneja la pagina de confirmacion de Drive para archivos grandes.
          # La version instalada de gdown NO acepta --fuzzy (run 3) ni --id (run 4):
          # su uso es gdown <url_o_id> -O salida, con el ID/link como argumento posicional.
          # Extraer el ID del archivo de un link de vista (/file/d/ID/view) o uc (id=ID),
          # y bajar con gdown <ID>. Un curl directo a un link de vista solo baja HTML.
          if echo "$DRIVE_DOWNLOAD_URL" | grep -q "drive.google.com"; then
            FILE_ID=$(echo "$DRIVE_DOWNLOAD_URL" | sed -E 's/.*\/d\/([^\/\?]+).*/\1/; s/.*[?&]id=([^&]+).*/\1/')
            echo "Usando gdown con el ID del archivo de Drive (ID no se imprime)..."
            gdown "$FILE_ID" -O dump.zip
          elif echo "$DRIVE_DOWNLOAD_URL" | grep -Eq "^[A-Za-z0-9_-]{20,}$"; then
            gdown "$DRIVE_DOWNLOAD_URL" -O dump.zip
          else
            curl -L --fail -o dump.zip "$DRIVE_DOWNLOAD_URL"
          fi
          ls -lh dump.zip
          # Si lo bajado es HTML, no es el zip: es pagina de Drive, no el archivo directo.
          if head -c 200 dump.zip | grep -qi "<html"; then
            echo "ERROR: lo bajado NO es un zip, es una pagina HTML de Drive."
            echo "El secreto debe ser el link del archivo .zip con Anyone with link, no de la carpeta."
            exit 1
          fi
          mkdir -p dump_unzipped
          unzip -q dump.zip -d dump_unzipped
          if [ -d "dump_unzipped/updates" ] || [ -d "dump_unzipped/exefs" ]; then
            RESOLVED="dump_unzipped"
          else
            SUB=$(find dump_unzipped -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$SUB" ] && { [ -d "$SUB/updates" ] || [ -d "$SUB/exefs" ]; }; then
              RESOLVED="$SUB"
            else
              RESOLVED="dump_unzipped"
            fi
          fi
          echo "Dump descomprimido en: $RESOLVED"
          ls "$RESOLVED" | head -n 50
          echo "dump_path=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Build IPA only (sin app de Mac)
        env:
          DUMP_PATH: ${{ steps.resolve.outputs.dump_path }}
        run: |
          if [ ! -d "$DUMP_PATH" ]; then
            echo "Dump no encontrado en $DUMP_PATH."
            echo "Si usas Drive, pon el link como secreto DRIVE_DOWNLOAD_URL y vuelve a lanzar."
            echo "Si no, pon el dump en el runner antes de lanzar y usa dump_path."
            exit 1
          fi
          python3.12 nxs2.py setup
          if [ "${{ inputs.sign_with_xcode }}" = "true" ]; then
            python3.12 nxs2.py build "$DUMP_PATH" --ipa --xcode --team-id "${{ secrets.APPLE_TEAM_ID }}"
          else
            python3.12 nxs2.py build "$DUMP_PATH" --ipa
          fi

      - name: Upload IPA (borralo en cuanto lo descargues)
        uses: actions/upload-artifact@v4
        with:
          name: PokemonPokopia-ipa
          path: |
            **/out/*.ipa
            **/out/*.app
          retention-days: 1
          if-no-files-found: error

      - name: Borrar dump descargado del runner
        if: always()
        run: |
          rm -rf dump.zip dump_unzipped dump
          echo "Dump temporal borrado del runner."
